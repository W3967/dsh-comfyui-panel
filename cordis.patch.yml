# dsh-krea2-panel: Krea 2 (ComfyUI) image studio.
# `config` seeds the settings before the panel saves anything; values saved
# from the panel take precedence over this seed. Point `comfyRoot` at the
# ComfyUI directory that holds `models/`, `input/` and `output/`.
- insert:
    - id: krea2
      name: dsh-krea2-panel
      config:
        comfyUrl: 'http://127.0.0.1:8188'
        comfyRoot: ''
